#top{position:sticky;top:0;z-index:5;padding:14px 16px 8px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px)}
h1{margin:0;font-size:22px;font-weight:800}small{color:var(--mut)}
#per{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.ch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.ch.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(110,100,255,.28)}
#cus{display:none;gap:8px;margin-top:8px}#cus.on{display:flex}
input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;outline:none}
input:focus{border-color:#8b7bff;box-shadow:0 0 0 3px rgba(139,123,255,.15)}
main{padding:8px 16px}.v{display:none;animation:up .35s ease}.v.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 30px rgba(90,100,160,.1)}
.hero{background:var(--g);color:#fff;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 14px 34px rgba(110,100,255,.32);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .big{font-size:32px;font-weight:800;margin:4px 0 14px}.hero small{color:rgba(255,255,255,.8)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:rgba(255,255,255,.18);border-radius:16px;padding:12px;position:relative;z-index:1}.mini b{display:block;font-size:15px;margin-top:2px}
.dl{font-size:11px;font-weight:700;margin-left:6px}.dl.ok{color:#0f9f6e}.dl.no{color:var(--bad)}.hero .dl{color:#fff;opacity:.9}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 4px;font-weight:700}
.ins{display:flex;gap:12px;align-items:center;padding:10px 0}.ins+.ins{border-top:1px solid var(--line)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:#eef1ff;flex:none}
.it{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}.it:active{background:#f6f7fd}
.it .m{flex:1;min-width:0}.it .m b,.it .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--in)}
.dh{font-size:12px;font-weight:700;color:var(--mut);margin:14px 4px 0}
.bar{height:8px;border-radius:9px;background:#eef0f8;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}.empty div{font-size:38px}
.sk{height:110px;border-radius:22px;margin:12px 0;background:linear-gradient(90deg,#f1f3fa 25%,#e8ebf6 50%,#f1f3fa 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:8px;box-shadow:0 12px 40px rgba(80,90,160,.2)}
nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mut);padding:6px 0;cursor:pointer}
nav button.on{color:#6b5cff}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fab{width:58px;height:58px;border-radius:50%;background:var(--g)!important;color:#fff!important;margin:-26px auto 0;box-shadow:0 10px 24px rgba(110,100,255,.45);font-size:30px;line-height:1;padding:0;place-items:center}
.scrim{position:fixed;inset:0;background:rgba(20,22,45,.35);z-index:8;opacity:0;pointer-events:none;transition:.25s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.sheet.on{transform:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f0f2fa;border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:11px;border-radius:12px;font-weight:700;color:var(--mut)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
#f-nom{font-size:30px;font-weight:800;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0;box-shadow:none}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips .ch{padding:6px 12px;font-size:12px}
details{margin-top:14px}summary{font-weight:700;font-size:13px;color:#6b5cff;cursor:pointer}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:16px;margin-top:18px;background:var(--g);color:#fff;box-shadow:0 10px 24px rgba(110,100,255,.35);cursor:pointer}.btn:disabled{opacity:.6}
.btn.s{background:#fff;color:var(--bad);box-shadow:none;border:1px solid #f6c9d1;margin-top:10px}.btn.g{background:#f0f2fa;color:var(--ink);box-shadow:none}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:60;padding:12px 18px;border-radius:16px;color:#fff;font-weight:600;font-size:14px;transition:.35s;max-width:90%}#toast.on{transform:translate(-50%,0)}
.hf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#qa{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#qa button{border:0;border-radius:18px;padding:14px;font-weight:800;color:#fff;font-size:15px;box-shadow:0 10px 24px rgba(20,20,60,.22);cursor:pointer}
.qi{background:linear-gradient(135deg,#0fa596,#2dd4bf)}.qo{background:var(--g)}
.acc{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
#cn{position:fixed;inset:0;z-index:30;background:#fff;padding:28px 20px;overflow:auto;display:none}
.ch{color:var(--ink)}.ch.on{color:#fff}.hero .ch{font-weight:700;padding:11px}
</style></head><body>

<div class="v on" id="v-home"></div>
<div class="v" id="v-hist"><div class="card"><input id="q" placeholder="Cari kategori, catatan, bank…" oninput="S.q=this.value;S.lim=50;hist()">
<div class="hf"><select id="hc" onchange="S.cat=this.value;S.lim=50;hist()"></select><select id="hp" onchange="S.ac=this.value;S.lim=50;hist()"></select><select onchange="S.tp=this.value;S.lim=50;hist()"><option value="">Semua jenis</option><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select><span></span><input type="date" onchange="S.hf=this.value;hist()"><input type="date" onchange="S.ht=this.value;hist()"></div></div><div style="text-align:right;margin:-4px 2px 6px"><button class="ch" onclick="csv()">⬇ Ekspor CSV</button></div><div id="hl"></div></div>
<div class="v" id="v-stat"></div><div class="v" id="v-acc"></div><div class="v" id="v-sav"></div>
</main>
<nav>
<button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
<button data-v="hist"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Riwayat</button>
<button id="fab" onclick="openForm(-1)" aria-label="Tambah Transaksi">+</button><button data-v="acc"><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12M16 14h.01"/></svg>Akun</button>
<button data-v="stat"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>

</nav>
<div class="scrim" onclick="closeAll()"></div>
<div class="sheet" id="sheet">
<div class="seg"><button id="t-out" onclick="setType('out')">Pengeluaran</button><button id="t-in" onclick="setType('in')">Pemasukan</button></div>
<small>Nominal (Rp)</small><input id="f-nom" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))">
<label>Kategori</label><input id="f-kat" placeholder="Pilih atau ketik kategori" oninput="mark()"><div class="chips" id="c-kat"></div><label>Akun / dompet</label><input id="f-acc" placeholder="Pilih akun"><div class="chips" id="c-acc"></div>
<label>Tanggal</label><input type="date" id="f-tgl">
<label>Catatan (opsional)</label><input id="f-cat" placeholder="Misal: makan siang">
<details id="dt"><summary>Detail tambahan</summary>
<label>Biaya admin</label><input id="f-adm" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))">
<label>Metode pembayaran</label><input id="f-met" placeholder="Tunai, Transfer, QRIS…"><div class="chips" id="c-met"></div>
</details>
<button class="btn" id="f-save" onclick="save()">Simpan</button>
<button class="btn s" id="f-del" onclick="askDel()">Hapus transaksi</button></div>
<div class="sheet" id="cfm"><h3 style="margin:0 0 6px">Hapus data ini?</h3><small>Barisnya akan dihapus dari Google Sheets dan tidak bisa dibatalkan.</small>
<button class="btn s" id="d-ok" onclick="doDel()">Ya, hapus</button><button class="btn g" onclick="closeAll()">Batal</button></div>
<div class="sheet" id="sa"><h3 style="margin:0 0 4px" id="sa-t">Akun</h3><label>Nama akun</label><input id="a-nm" placeholder="BCA, Gopay, Cash…"><label>Tipe</label><select id="a-tp"><option>Bank</option><option>E-wallet</option><option>Tunai</option></select><label>Saldo awal (Rp)</label><input id="a-sd" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))"><button class="btn" id="a-ok" onclick="saveAcc()">Simpan</button></div>
<div class="sheet" id="st"><h3 style="margin:0 0 4px">Transfer antar akun</h3><label>Dari</label><select id="t-dr"></select><label>Ke</label><select id="t-ke"></select><label>Nominal (Rp)</label><input id="t-nm" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))"><label>Biaya admin (opsional)</label><input id="t-ad" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))"><label>Tanggal</label><input type="date" id="t-tg"><label>Catatan</label><input id="t-ct"><button class="btn" id="t-ok" onclick="saveTrf()">Transfer</button></div>
<div class="sheet" id="sg"><h3 id="sg-t" style="margin:0 0 4px">Target tabungan</h3><label>Nama target</label><input id="g-nm" placeholder="Dana darurat, Laptop baru…"><label>Nominal target (Rp)</label><input id="g-tg" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))"><label>Tenggat (opsional)</label><input type="date" id="g-td"><button class="btn" id="g-ok" onclick="saveGoalUI()">Simpan</button><button class="btn s" id="g-del" onclick="S.dg=S.eg;askDel()">Hapus target</button></div>
<div class="sheet" id="sd"><h3 id="sd-t" style="margin:0 0 4px"></h3><label>Nominal (Rp)</label><input id="sd-nm" inputmode="numeric" placeholder="0" oninput="this.value=fmtN(getNum(this))"><label>Tanggal</label><input type="date" id="sd-tg"><label>Catatan (opsional)</label><input id="sd-ct"><button class="btn" id="sd-ok" onclick="saveDep()">Simpan</button></div>
<div id="cn"><img alt="FINARA" style="height:44px"><h2>Hubungkan FINARA</h2><small>Masukkan URL Web App dan token dari menu FINARA → Setup di spreadsheet-mu. Keduanya hanya tersimpan di HP ini.</small><label>URL Web App</label><input id="c-url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off"><label>Token</label><input id="c-tok" type="password" autocapitalize="off"><button class="btn" id="c-btn" onclick="connect()">Hubungkan</button><button class="btn g" id="c-x" onclick="$('#cn').style.display='none'">Tutup</button><button class="btn s" id="c-d" onclick="localStorage.removeItem('finara');location.reload()">Putuskan koneksi</button></div>
<script>
const $=s=>document.querySelector(s);
const CFG=()=>{try{return JSON.parse(localStorage.getItem('finara')||'null')}catch(e){return null}};
const gs=async(fn,...a)=>{const c=CFG();if(!c)throw new Error('Belum terhubung');const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,fn,args:a})});const j=await r.json();if(j.error)throw new Error(j.error);return j.data};
const S={sav:[],dep:[],acc:[],trf:[],ac:'',tp:'',tx:[],period:'month',from:'',to:'',view:'home',trend:'day',type:'out',edit:null,q:'',cat:'',hf:'',ht:'',lim:50,loaded:false};
const DEF={out:['Makan & Minum','Transportasi','Belanja','Tagihan','Pendidikan','Kesehatan','Hiburan','Langganan','Lainnya'],in:['Uang Saku','Gaji','Beasiswa','Hasil Usaha','Hadiah','Transfer Masuk','Lainnya']};
const MET=['Tunai','Transfer','QRIS','E-wallet','Debit','Kredit'];
const PER=[['day','Hari ini'],['week','Minggu ini'],['month','Bulan ini'],['custom','Custom']];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const rp=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID');
const fmtN=n=>n?n.toLocaleString('id-ID'):'';
const getNum=e=>Number(String(e.value).replace(/\D/g,''))||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const TODAY=()=>ymd(new Date());
const fd=s=>{const d=pd(s);return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};
const eff=t=>t.type==='in'?t.nominal-t.admin:t.nominal+t.admin;
function toast(m,k){const t=$('#toast');t.textContent=m;t.style.background=k==='bad'?'#ee5a6f':'#161a2b';t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000)}
function range(){const t=TODAY(),d=pd(t);
 if(S.period==='day')return[t,t];
 if(S.period==='week'){const f=add(t,-((d.getDay()+6)%7));return[f,add(f,6)]}
 if(S.period==='month')return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
 let f=S.from||t,e=S.to||t;return f>e?[e,f]:[f,e]}
function prevRange(){const[f,t]=range();
 if(S.period==='month'){const d=pd(f);return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))]}
 const n=diff(f,t)+1;return[add(f,-n),add(f,-1)]}
const inR=(t,r)=>t.tanggal>=r[0]&&t.tanggal<=r[1];
const sum=r=>{let i=0,o=0;S.tx.forEach(t=>{if(inR(t,r))t.type==='in'?i+=eff(t):o+=eff(t)});return{i,o}};
const dl=(c,p,good)=>{if(!c&&!p)return'';if(!p)return'<span class="dl">baru</span>';const x=(c-p)/p*100,up=x>=0;return`<span class="dl ${up===(good==='up')?'ok':'no'}">${up?'▲':'▼'} ${Math.abs(x).toFixed(0)}%</span>`};
function cats(rows){const m={};rows.filter(t=>t.type==='out').forEach(t=>{const k=t.kategori||'Tanpa kategori';m[k]=(m[k]||0)+eff(t)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const empty=(t)=>`<div class="empty"><div>🫧</div><b>${t}</b><br><small>Tekan tombol + untuk mencatat transaksi</small></div>`;
const item=t=>`<div class="it" onclick="openForm(${S.tx.indexOf(t)})"><div class="ic" style="color:${t.type==='in'?'var(--in)':'var(--out)'}">${t.type==='in'?'↓':'↑'}</div><div class="m"><b>${esc(t.kategori||'Tanpa kategori')}</b><small>${esc([t.catatan,t.metode].filter(Boolean).join(' · ')||fd(t.tanggal))}</small></div><div class="amt ${t.type}">${t.type==='in'?'+':'-'}${rp(t.nominal)}</div></div>`;

function home(){const r=range(),p=prevRange(),c=sum(r),q=sum(p),rows=S.tx.filter(t=>inR(t,r)),ct=cats(rows),e=r[1]<TODAY()?r[1]:TODAY(),days=Math.max(1,diff(r[0],e)+1),dif=c.o-q.o,P=c.i>0?Math.round(c.o/c.i*100):null;
 $('#v-home').innerHTML=`<div class="hero"><small>Saldo bersih · ${fd(r[0])}${r[0]!==r[1]?' – '+fd(r[1]):''}</small><div class="big">${rp(c.i-c.o)}</div>
 <div class="two"><div class="mini"><small>Pemasukan</small><b>${rp(c.i)}${dl(c.i,q.i,'up')}</b></div><div class="mini"><small>Pengeluaran</small><b>${rp(c.o)}${dl(c.o,q.o,'down')}</b></div></div></div>
 <div class="sec">Insight</div><div class="card">
 <div class="ins"><div class="ic">🏷️</div><div><small>Kategori pengeluaran terbesar</small><br><b>${ct[0]?esc(ct[0][0])+' · '+rp(ct[0][1])+' ('+Math.round(ct[0][1]/c.o*100)+'%)':'–'}</b></div></div>
 <div class="ins"><div class="ic">📅</div><div><small>Rata-rata pengeluaran harian</small><br><b>${rp(c.o/days)}</b></div></div>
 <div class="ins"><div class="ic">📊</div><div style="flex:1"><small>Pengeluaran terhadap pemasukan</small><br><b>${P===null?(c.o?'Belum ada pemasukan':'–'):P+'%'}</b>${P===null?'':`<div class="bar"><i style="width:${Math.min(100,P)}%${P>100?';background:var(--bad)':''}"></i></div>`}</div></div>
 <div class="ins"><div class="ic">⚖️</div><div><small>Dibanding periode sebelumnya</small><br><b>${q.o||c.o?(dif>0?'Boros '+rp(dif):dif<0?'Hemat '+rp(-dif):'Sama persis'):'–'}</b></div></div></div>
 ${savCard()}<div class="sec">Transaksi terbaru <small style="cursor:pointer" onclick="go('hist')">Lihat semua</small></div>
 <div class="card" style="padding:4px 12px">${S.tx.length?S.tx.slice(0,5).map(item).join(''):empty('Belum ada transaksi')}</div>`}

function trend(r){let mode=S.trend;const n=diff(r[0],r[1])+1;if(n>31)mode='month';let keys=[];
 if(mode==='day'){for(let i=0;i<n;i++)keys.push(add(r[0],i))}
 else{const d=pd(r[0]);d.setDate(1);const e=pd(r[1]);while(d<=e){keys.push(d.getFullYear()+'-'+p2(d.getMonth()+1));d.setMonth(d.getMonth()+1)}keys=keys.slice(-12)}
 const L=mode==='day'?10:7,I={},O={};
 S.tx.forEach(t=>{if(!inR(t,r))return;const k=t.tanggal.slice(0,L),m=t.type==='in'?I:O;m[k]=(m[k]||0)+eff(t)});
 const mx=Math.max(1,...keys.map(k=>Math.max(I[k]||0,O[k]||0))),W=340,H=120,sl=W/keys.length,bw=Math.max(2,Math.min(9,sl/2.5)),st=Math.ceil(keys.length/8);
 let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#12b5a6" stop-opacity=".45"/></linearGradient><linearGradient id="go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#4f7cff" stop-opacity=".5"/></linearGradient></defs>`;
 keys.forEach((k,i)=>{const x=i*sl+sl/2,a=(I[k]||0)/mx*H,b=(O[k]||0)/mx*H;
  s+=`<rect x="${x-bw-.5}" y="${H-a}" width="${bw}" height="${a}" rx="${bw/2.5}" fill="url(#gi)"/><rect x="${x+.5}" y="${H-b}" width="${bw}" height="${b}" rx="${bw/2.5}" fill="url(#go)"/>`;
  if(i%st===0)s+=`<text x="${x}" y="${H+13}" text-anchor="middle" font-size="9" fill="#7a8099">${mode==='day'?+k.slice(8):BLN[+k.slice(5)-1]}</text>`});
 return s+'</svg>'}

function stat(){const r=range(),c=sum(r),q=sum(prevRange()),rows=S.tx.filter(t=>inR(t,r)),ct=cats(rows);
 if(!rows.length){$('#v-stat').innerHTML=`<div class="card">${empty('Belum ada data di periode ini')}</div>`;return}
 const mx=Math.max(c.i,c.o,1);
 $('#v-stat').innerHTML=`<div class="sec">Pengeluaran per kategori</div><div class="card">${ct.length?ct.map(([k,v])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(k)}</b><span>${rp(v)} · ${Math.round(v/c.o*100)}%</span></div><div class="bar"><i style="width:${v/ct[0][1]*100}%"></i></div></div>`).join(''):empty('Belum ada pengeluaran')}</div>
 <div class="sec">Tren <span><button class="ch ${S.trend==='day'?'on':''}" onclick="S.trend='day';stat()">Harian</button> <button class="ch ${S.trend==='month'?'on':''}" onclick="S.trend='month';stat()">Bulanan</button></span></div>
 <div class="card">${trend(r)}<small><span style="color:var(--in)">■</span> Pemasukan &nbsp; <span style="color:var(--out)">■</span> Pengeluaran</small></div>
 <div class="sec">Pemasukan vs pengeluaran</div><div class="card">
 <div style="font-size:13px"><b>Pemasukan</b> ${rp(c.i)}${dl(c.i,q.i,'up')}</div><div class="bar"><i style="width:${c.i/mx*100}%;background:linear-gradient(90deg,#2dd4bf,#12b5a6)"></i></div>
 <div style="font-size:13px;margin-top:12px"><b>Pengeluaran</b> ${rp(c.o)}${dl(c.o,q.o,'down')}</div><div class="bar"><i style="width:${c.o/mx*100}%"></i></div></div>`}

function hist(){const q=S.q.toLowerCase(),a=S.tx.filter(t=>(!S.cat||t.kategori===S.cat)&&(!S.tp||t.type===S.tp)&&(!S.ac||t.sumber===S.ac||t.tujuan===S.ac)&&(!S.hf||t.tanggal>=S.hf)&&(!S.ht||t.tanggal<=S.ht)&&(!q||[t.kategori,t.catatan,t.metode,t.sumber,t.tujuan,t.id].join(' ').toLowerCase().includes(q)));
 S.fl=a;if(!a.length){$('#hl').innerHTML=empty(S.tx.length?'Tidak ada yang cocok':'Belum ada transaksi');return}
 let h='',last='';a.slice(0,S.lim).forEach(t=>{if(t.tanggal!==last){last=t.tanggal;h+=`<div class="dh">${fd(t.tanggal)}</div>`}h+=item(t)});
 if(a.length>S.lim)h+=`<button class="btn g" onclick="S.lim+=50;hist()">Tampilkan lebih banyak</button>`;
 $('#hl').innerHTML=`<div class="card" style="padding:4px 12px">${h}</div>`}

function render(){
 $('#per').innerHTML=PER.map(([k,l])=>`<button class="ch ${S.period===k?'on':''}" onclick="setPer('${k}')">${l}</button>`).join('');
 $('#cus').classList.toggle('on',S.period==='custom');$('#cf').value=S.from;$('#ct').value=S.to;
 $('#top').querySelector('#per').style.display=['hist','acc','sav'].includes(S.view)?'none':'flex';if(['hist','acc','sav'].includes(S.view))$('#cus').classList.remove('on');
 if(!S.loaded)return;home();stat();hist();acct();sav()}
function setPer(k){S.period=k;if(k==='custom'&&!S.from){S.from=add(TODAY(),-6);S.to=TODAY()}render()}
function go(v){S.view=v;document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));

function setData(d){S.acc=d.acc;S.trf=d.trf;S.sav=d.sav||[];S.dep=d.dep||[];d=d.tx;S.tx=d.sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.row-a.row);S.loaded=true;
 const ks=[...new Set(S.tx.map(t=>t.kategori).filter(Boolean))].sort();
 $('#hc').innerHTML='<option value="">Semua kategori</option>'+ks.map(k=>`<option ${k===S.cat?'selected':''}>${esc(k)}</option>`).join('');$('#hp').innerHTML='<option value="">Semua akun</option>'+S.acc.map(a=>`<option ${a.nama===S.ac?'selected':''}>${esc(a.nama)}</option>`).join('');render()}
async function load(silent){if(!silent){if(!S.loaded)$('#v-home').innerHTML='<div class="sk"></div><div class="sk" style="height:200px"></div>';else toast('Memuat data…')}
 try{setData(await gs('getData'));if(!silent)toast('Data diperbarui')}catch(e){if(!S.loaded)$('#v-home').innerHTML=`<div class="card">${empty('Gagal memuat data')}<small>${esc(e.message||e)}</small><button class="btn" onclick="load()">Coba lagi</button></div>`;else toast('Gagal memuat: '+(e.message||e),'bad')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.loaded)load(true)});

/* ---- form ---- */
function topCats(type){const m={};S.tx.filter(t=>t.type===type&&t.kategori).forEach(t=>m[t.kategori]=(m[t.kategori]||0)+1);
 const top=Object.keys(m).sort((a,b)=>m[b]-m[a]).slice(0,6);return[...new Set([...top,...DEF[type]])]}
function chips(el,list,inp){$(el).innerHTML=list.map(k=>`<button type="button" class="ch" onclick="$('${inp}').value=this.textContent;mark()">${esc(k)}</button>`).join('');mark()}
function mark(){document.querySelectorAll('#c-kat .ch').forEach(c=>c.classList.toggle('on',c.textContent===$('#f-kat').value.trim()))}
function setType(t){S.type=t;$('#t-out').classList.toggle('on',t==='out');$('#t-in').classList.toggle('on',t==='in');chips('#c-kat',topCats(t),'#f-kat')}
function openForm(i,ty){const t=i>=0?S.tx[i]:null;S.edit=t;S.dt=null;
 $('#f-nom').value=t?fmtN(t.nominal):'';$('#f-kat').value=t?t.kategori:'';$('#f-tgl').value=t?t.tanggal:TODAY();$('#f-cat').value=t?t.catatan:'';
 $('#f-adm').value=t&&t.admin?fmtN(t.admin):'';$('#f-met').value=t?t.metode:'';$('#f-acc').value=t?(t.type==='in'?t.tujuan:t.sumber):(localStorage.getItem('finara_last')||(S.acc[0]?S.acc[0].nama:''));chips('#c-acc',S.acc.map(a=>a.nama),'#f-acc');
 $('#dt').open=!!(t&&(t.admin||t.metode||t.sumber||t.tujuan));$('#f-del').style.display=t?'block':'none';
 $('#f-save').textContent=t?'Simpan perubahan':'Simpan';setType(t?t.type:(ty||'out'));chips('#c-met',MET,'#f-met');
 $('.scrim').classList.add('on');$('#sheet').classList.add('on');if(!t)setTimeout(()=>$('#f-nom').focus(),350)}
function closeAll(){S.dt=S.dg=null;document.querySelectorAll('.sheet,.scrim').forEach(e=>e.classList.remove('on'));document.activeElement&&document.activeElement.blur()}
async function save(){const nom=getNum($('#f-nom')),kat=$('#f-kat').value.trim(),tgl=$('#f-tgl').value,e=S.edit,acc=$('#f-acc').value.trim();
 if(nom<=0)return toast('Nominal harus diisi dan lebih dari 0','bad');
 if(!kat)return toast('Pilih atau ketik kategori','bad');
 if(!tgl)return toast('Tanggal wajib diisi','bad');
 const o={type:S.type,row:e?e.row:0,origType:e?e.type:'',id:e?e.id:'',nom0:e?e.nominal:null,tanggal:tgl,kategori:kat,nominal:nom,admin:getNum($('#f-adm')),metode:$('#f-met').value,sumber:S.type==='out'?acc:(e?e.sumber:''),tujuan:S.type==='in'?acc:(e?e.tujuan:''),catatan:$('#f-cat').value};
 const b=$('#f-save');b.disabled=true;b.textContent='Menyimpan…';
 try{setData(await gs('saveTx',o));if(acc)localStorage.setItem('finara_last',acc);closeAll();toast('Tersimpan ke Google Sheets ✓')}
 catch(x){toast('Gagal menyimpan: '+(x.message||x),'bad')}
 finally{b.disabled=false;b.textContent=e?'Simpan perubahan':'Simpan'}}
function askDel(){document.querySelectorAll('.sheet').forEach(e=>e.classList.remove('on'));$('.scrim').classList.add('on');$('#cfm').classList.add('on')}
async function doDel(){const e=S.edit,b=$('#d-ok'),d=S.dt,dg=S.dg;if(dg){b.disabled=true;try{setData(await gs('deleteGoal',dg.row,dg.id));closeAll();toast('Target dihapus')}catch(x){toast('Gagal menghapus: '+(x.message||x),'bad')}finally{b.disabled=false}return}if(d){b.disabled=true;try{setData(await gs('deleteTransfer',d.row,d.id));closeAll();toast('Transfer dihapus')}catch(x){toast('Gagal menghapus: '+(x.message||x),'bad')}finally{b.disabled=false}return}b.disabled=true;b.textContent='Menghapus…';
 try{setData(await gs('deleteTx',e.type,e.row,e.id,e.nominal));closeAll();toast('Transaksi dihapus')}
 catch(x){toast('Gagal menghapus: '+(x.message||x),'bad')}
 finally{b.disabled=false;b.textContent='Ya, hapus'}}
$('#sub').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const bal=a=>{let b=a.saldo;S.tx.forEach(t=>{if(t.type==='in'&&t.tujuan===a.nama)b+=t.nominal-t.admin;if(t.type==='out'&&t.sumber===a.nama)b-=t.nominal+t.admin});S.trf.forEach(x=>{if(x.ke===a.nama)b+=x.nominal;if(x.dari===a.nama)b-=x.nominal+x.admin});return b};
function acct(){const A=S.acc,tot=A.reduce((s,a)=>s+bal(a),0);
 $('#v-acc').innerHTML=`<div class="hero"><small>Total saldo semua akun</small><div class="big">${rp(tot)}</div><div class="two"><button class="ch" onclick="openAcc(-1)">+ Tambah akun</button><button class="ch" onclick="openTrf()">⇄ Transfer</button></div></div>
 <div class="card" style="padding:4px 12px">${A.length?A.map((a,i)=>`<div class="acc" onclick="openAcc(${i})"><div class="ic">${a.tipe==='Bank'?'🏦':a.tipe==='E-wallet'?'📱':'💵'}</div><div style="flex:1"><b>${esc(a.nama)}</b><br><small>${esc(a.tipe)}</small></div><div class="amt">${rp(bal(a))}</div></div>`).join(''):empty('Belum ada akun')}</div><button class="btn" onclick="openAcc(-1)">+ Tambah akun</button>
 <div class="sec">Transfer terakhir</div><div class="card" style="padding:4px 12px">${S.trf.length?S.trf.map((x,i)=>[x,i]).reverse().slice(0,15).map(([x,i])=>`<div class="it" onclick="S.dt=S.trf[${i}];askDel()"><div class="ic">⇄</div><div class="m"><b>${esc(x.dari)} → ${esc(x.ke)}</b><small>${fd(x.tanggal)}${x.catatan?' · '+esc(x.catatan):''}</small></div><div class="amt">${rp(x.nominal)}</div></div>`).join(''):'<div class="empty"><small>Belum ada transfer</small></div>'}</div>`}
function showSheet(id){document.querySelectorAll('.sheet').forEach(e=>e.classList.remove('on'));$('.scrim').classList.add('on');$('#'+id).classList.add('on')}
function openAcc(i){S.ea=i>=0?S.acc[i]:null;const a=S.ea;$('#sa-t').textContent=a?'Edit akun':'Tambah akun';$('#a-nm').value=a?a.nama:'';$('#a-tp').value=a?a.tipe:'Bank';$('#a-sd').value=a?fmtN(a.saldo):'';showSheet('sa')}
async function wrap(btn,txt,fn,ok){btn.disabled=true;btn.textContent='Menyimpan…';try{setData(await fn());closeAll();toast(ok)}catch(x){toast('Gagal: '+(x.message||x),'bad')}finally{btn.disabled=false;btn.textContent=txt}}
function saveAcc(){const nm=$('#a-nm').value.trim();if(!nm)return toast('Nama akun wajib diisi','bad');const a=S.ea;wrap($('#a-ok'),'Simpan',()=>gs('saveAccount',{row:a?a.row:0,id:a?a.id:'',nama:nm,tipe:$('#a-tp').value,saldo:getNum($('#a-sd'))}),'Akun tersimpan ✓')}
function openTrf(){if(S.acc.length<2)return toast('Tambahkan minimal 2 akun dulu','bad');const o=S.acc.map(a=>`<option>${esc(a.nama)}</option>`).join('');$('#t-dr').innerHTML=o;$('#t-ke').innerHTML=o;$('#t-ke').selectedIndex=1;['#t-nm','#t-ad','#t-ct'].forEach(s=>$(s).value='');$('#t-tg').value=TODAY();showSheet('st')}
function saveTrf(){const n=getNum($('#t-nm')),d=$('#t-dr').value,k=$('#t-ke').value;if(n<=0)return toast('Nominal harus lebih dari 0','bad');if(d===k)return toast('Pilih dua akun yang berbeda','bad');wrap($('#t-ok'),'Transfer',()=>gs('saveTransfer',{tanggal:$('#t-tg').value,dari:d,ke:k,nominal:n,admin:getNum($('#t-ad')),catatan:$('#t-ct').value}),'Transfer tersimpan ✓')}
function showConnect(){const c=CFG()||{};$('#cn img').src=$('#top img').src;$('#c-url').value=c.url||'';$('#c-tok').value=c.token||'';$('#c-x').style.display=$('#c-d').style.display=c.url?'block':'none';$('#cn').style.display='block'}
async function connect(){const url=$('#c-url').value.trim(),token=$('#c-tok').value.trim(),b=$('#c-btn'),old=localStorage.getItem('finara');
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return toast('URL harus berakhiran /exec dari Web App','bad');
 if(!token)return toast('Token wajib diisi','bad');
 localStorage.setItem('finara',JSON.stringify({url,token}));b.disabled=true;b.textContent='Menghubungkan…';
 try{setData(await gs('getData'));$('#cn').style.display='none';toast('Terhubung ✓')}
 catch(x){old?localStorage.setItem('finara',old):localStorage.removeItem('finara');const m=String(x.message||x);toast(/fetch|network|load failed/i.test(m)?'Tidak bisa menghubungi URL. Pastikan URL benar dan deploy Web App diset "Anyone".':'Gagal terhubung: '+m,'bad')}
 finally{b.disabled=false;b.textContent='Hubungkan'}}
const got=g=>S.dep.filter(d=>d.goal===g.id).reduce((s,d)=>s+d.nominal,0);
function savCard(){const G=S.sav;if(!G.length)return`<div class="sec">Tabungan</div><div class="card" style="text-align:center"><small>Belum ada target tabungan</small><br><button class="ch" style="margin-top:8px" onclick="go('sav')">🎯 Mulai menabung</button></div>`;
 return`<div class="sec">Tabungan <small style="cursor:pointer" onclick="go('sav')">Kelola</small></div><div class="card">${G.slice(0,3).map(g=>{const c=got(g),p=Math.min(100,c/g.target*100);return`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(g.nama)}</b><span>${rp(c)} / ${rp(g.target)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>`}
function sav(){const G=S.sav,al=G.reduce((s,g)=>s+got(g),0),tot=S.acc.reduce((s,a)=>s+bal(a),0);
 $('#v-sav').innerHTML=`<div class="hero"><small>Dana dialokasikan untuk tabungan</small><div class="big">${rp(al)}</div><div class="two"><div class="mini"><small>Total saldo akun</small><b>${rp(tot)}</b></div><div class="mini"><small>Bebas dipakai</small><b>${rp(tot-al)}</b></div></div></div><button class="btn" style="margin-top:0" onclick="openGoal(-1)">+ Target tabungan baru</button>
 ${G.length?G.map((g,i)=>{const c=got(g),p=Math.min(100,c/g.target*100);return`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(g.nama)}</b><small onclick="openGoal(${i})" style="cursor:pointer">Edit</small></div><div style="font-size:22px;font-weight:800;margin:6px 0">${rp(c)}<small> / ${rp(g.target)}</small></div><div class="bar"><i style="width:${p}%"></i></div><small>${p>=100?'Target tercapai 🎉':Math.round(p)+'% · sisa '+rp(g.target-c)}${g.tenggat?' · tenggat '+fd(g.tenggat):''}</small><div class="two" style="margin-top:12px"><button class="btn" style="margin:0;padding:11px" onclick="openDep(${i},1)">+ Setor</button><button class="btn g" style="margin:0;padding:11px" onclick="openDep(${i},-1)">− Tarik</button></div></div>`}).join(''):'<div class="empty"><small>Belum ada target tabungan</small></div>'}
 <div style="text-align:center"><button class="ch" onclick="go('home')">← Kembali ke Beranda</button></div>`}
function openGoal(i){S.eg=i>=0?S.sav[i]:null;const g=S.eg;$('#sg-t').textContent=g?'Edit target':'Target tabungan baru';$('#g-nm').value=g?g.nama:'';$('#g-tg').value=g?fmtN(g.target):'';$('#g-td').value=g?g.tenggat:'';$('#g-del').style.display=g?'block':'none';showSheet('sg')}
function saveGoalUI(){const nm=$('#g-nm').value.trim(),t=getNum($('#g-tg')),g=S.eg;if(!nm)return toast('Nama target wajib diisi','bad');if(t<=0)return toast('Nominal target harus lebih dari 0','bad');
 wrap($('#g-ok'),'Simpan',()=>gs('saveGoal',{row:g?g.row:0,id:g?g.id:'',nama:nm,target:t,tenggat:$('#g-td').value}),'Target tersimpan ✓')}
function openDep(i,s){S.ed={g:S.sav[i],s};$('#sd-t').textContent=(s>0?'Setor ke ':'Tarik dari ')+S.sav[i].nama;$('#sd-nm').value='';$('#sd-tg').value=TODAY();$('#sd-ct').value='';showSheet('sd')}
function saveDep(){const n=getNum($('#sd-nm')),{g,s}=S.ed;if(n<=0)return toast('Nominal harus lebih dari 0','bad');if(s<0&&n>got(g))return toast('Penarikan melebihi dana terkumpul ('+rp(got(g))+')','bad');
 wrap($('#sd-ok'),'Simpan',()=>gs('saveDeposit',{goal:g.id,tanggal:$('#sd-tg').value,nominal:s*n,catatan:$('#sd-ct').value}),s>0?'Setoran tersimpan ✓':'Penarikan tersimpan ✓')}
function csv(){const A=S.fl||S.tx;if(!A.length)return toast('Tidak ada data untuk diekspor','bad');
 const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const R=[['Tanggal','Jenis','Kategori','Nominal','Biaya Admin','Metode Pembayaran','Akun','Catatan','ID Transaksi'],...A.map(t=>[t.tanggal,t.type==='in'?'Pemasukan':'Pengeluaran',t.kategori,t.nominal,t.admin,t.metode,t.type==='in'?t.tujuan:t.sumber,t.catatan,t.id])];
 const b=new Blob(['\ufeff'+R.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='finara-transaksi-'+TODAY()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(A.length+' transaksi diekspor')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();CFG()?load():showConnect();
</script></body></html>
